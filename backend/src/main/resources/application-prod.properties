# Activated with -Dspring.profiles.active=prod (the Dockerfile does this). No defaults, so the app refuses to start if a value is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
server.forward-headers-strategy=framework
jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.cors.allowed-origins=${CORS_ORIGINS}
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}
