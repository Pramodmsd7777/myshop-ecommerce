# ---------- Server ----------
server.port=8080

# ---------- Database (Railway MySQL) ----------
spring.datasource.url=${jdbc:mysql://mysql.railway.internal:3306/ecommerce_db}
spring.datasource.username=${root}
spring.datasource.password=${}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Admin ----------
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed-demo-data=${SEED_DEMO_DATA:false}
app.cors.allowed-origins=${CORS_ORIGINS}

# ---------- Razorpay ----------
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}