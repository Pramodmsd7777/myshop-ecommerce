# ---------- Server ----------
server.port=8080

# ---------- Database (local MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/myshop?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_LOCAL_MYSQL_PASSWORD

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# dev-only JWT secret: never use this value in production
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.seed-demo-data=${SEED_DEMO_DATA:true}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
